name: 声向音乐资讯采集

on:
  schedule:
    # GitHub schedule 会延迟/丢帧，设多个错峰点靠"东方不亮西方亮"提高命中率。
    # 全部错开整点（:00 的 cron 最容易被无限拖延）。workflow 有 concurrency 防重入、
    # cloud_writer 有 source_url/title 去重，多跑几次不会重复入库。
    - cron: '8,28,48 * * * *'
  workflow_dispatch: {}

# 同一时间只跑一个，避免上一轮没跑完就叠加
concurrency:
  group: soundvector-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 流媒体榜单监测（Spotify/QQ/网易云/酷狗）
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/collect_charts.py --proxy direct
        continue-on-error: true

      - name: 全球资讯采集（RSS + Bing + YouTube + GDELT）
        env:
          PYTHONIOENCODING: utf-8
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python collector/collect_global.py --proxy direct --limit 120 --days 2
        continue-on-error: true

      - name: 写入云数据库（去重 + 音乐相关性过滤）
        env:
          PYTHONIOENCODING: utf-8
          WB_KEY: ${{ secrets.WB_KEY }}
        run: python collector/cloud_writer.py --limit 40

      - name: 心跳提交（每轮必 push，触发云托管自动同步最新代码）
        # 微信云托管绑定 GitHub 后靠 push 事件的 webhook 自动重建。
        # 榜单无变化时不 commit 会导致某些轮次没有 push → 云托管收不到触发，
        # 叠加 webhook 偶发 502 抖动，代码改动就可能迟迟不上线。
        # 这里每轮更新时间戳、保证必有一次 push；GITHUB_TOKEN 的 push 不会
        # 触发新 workflow（GitHub 防递归），但会触发云托管 webhook——正合需要。
        # schedule 已设 8/28/48 三个错峰点，每小时最多 3 次触发机会。
        run: |
          git config user.name "soundvector-bot"
          git config user.email "bot@users.noreply.github.com"
          git config core.quotepath false
          git add collector/out/charts/_last_snapshot.json
          # 用户提问的补采状态：不提交的话每轮都会重复搜同一批问题
          git add collector/out/state 2>/dev/null || true
          # 心跳时间戳：每轮内容都不同，保证每轮必有一次 commit+push
          mkdir -p collector/out/state
          printf '{"at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > collector/out/state/heartbeat.json
          git add -f collector/out/state/heartbeat.json
          git commit -m "chore: 采集心跳 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "无变化，跳过"
          git push || echo "push 失败，等待下轮重试"

      - name: 汇总本次产出
        if: always()
        env:
          WB_KEY: ${{ secrets.WB_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          echo "### 云端数据库现状" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python collector/query.py --stats 2>&1 | head -25 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 本次采集结果" >> $GITHUB_STEP_SUMMARY
          f=$(ls -1t collector/out/batch_*.json 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "- 批采文件：$f" >> $GITHUB_STEP_SUMMARY; fi
          e=$(ls -1t collector/out/charts/events_*.json 2>/dev/null | head -1)
          if [ -n "$e" ]; then echo "- 榜单事件：$e" >> $GITHUB_STEP_SUMMARY; fi
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          import glob, json
          b = sorted(glob.glob("collector/out/batch_*.json"))
          e = sorted(glob.glob("collector/out/charts/events_*.json"))
          if b:
              d = json.load(open(b[-1], encoding="utf-8"))
              print("- 抓取候选：%d 条" % len(d.get("articles") or []))
          if e:
              d = json.load(open(e[-1], encoding="utf-8"))
              print("- 榜单变化事件：%d 条" % d.get("count", 0))
          EOF
