name: 声向音乐资讯采集

on:
  schedule:
    # GitHub schedule 会延迟/丢帧，设多个错峰点靠"东方不亮西方亮"提高命中率。
    # 全部错开整点（:00 的 cron 最容易被无限拖延）。workflow 有 concurrency 防重入、
    # cloud_writer 有 source_url/title 去重，多跑几次不会重复入库。
    - cron: '8,28,48 * * * *'
  workflow_dispatch: {}

# 同一时间只跑一个，避免上一轮没跑完就叠加
concurrency:
  group: soundvector-collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 允许用内置 GITHUB_TOKEN dispatch 自己，维持每小时自接力

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 流媒体榜单监测（Spotify/QQ/网易云/酷狗）
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/collect_charts.py --proxy direct
        continue-on-error: true

      - name: 全球资讯采集（RSS + Bing + YouTube + GDELT）
        env:
          PYTHONIOENCODING: utf-8
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python collector/collect_global.py --proxy direct --limit 120 --days 2
        continue-on-error: true

      - name: 写入云数据库（去重 + 音乐相关性过滤）
        env:
          PYTHONIOENCODING: utf-8
          WB_KEY: ${{ secrets.WB_KEY }}
        run: python collector/cloud_writer.py --limit 40

      - name: 回写榜单基线（供下一小时对比）
        run: |
          git config user.name "soundvector-bot"
          git config user.email "bot@users.noreply.github.com"
          git config core.quotepath false
          git add collector/out/charts/_last_snapshot.json
          # 用户提问的补采状态：不提交的话每轮都会重复搜同一批问题
          git add collector/out/state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "榜单无变化，无需提交"
          else
            git commit -m "chore: 更新榜单基线 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 汇总本次产出
        if: always()
        env:
          WB_KEY: ${{ secrets.WB_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          echo "### 云端数据库现状" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python collector/query.py --stats 2>&1 | head -25 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 本次采集结果" >> $GITHUB_STEP_SUMMARY
          f=$(ls -1t collector/out/batch_*.json 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "- 批采文件：$f" >> $GITHUB_STEP_SUMMARY; fi
          e=$(ls -1t collector/out/charts/events_*.json 2>/dev/null | head -1)
          if [ -n "$e" ]; then echo "- 榜单事件：$e" >> $GITHUB_STEP_SUMMARY; fi
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          import glob, json
          b = sorted(glob.glob("collector/out/batch_*.json"))
          e = sorted(glob.glob("collector/out/charts/events_*.json"))
          if b:
              d = json.load(open(b[-1], encoding="utf-8"))
              print("- 抓取候选：%d 条" % len(d.get("articles") or []))
          if e:
              d = json.load(open(e[-1], encoding="utf-8"))
              print("- 榜单变化事件：%d 条" % d.get("count", 0))
          EOF

      # 海外全量自维持：GitHub 自带 schedule 实测长期不触发，这里让本 workflow
      # 跑完用内置 GITHUB_TOKEN 给自己发下一次 workflow_dispatch（官方允许的例外），
      # 形成每小时一条自愈链。用仓库内时间戳文件节流 55 分钟，避免叠加空转；
      # 链万一断了，上面的多错峰 schedule 还能重启它。零外部 token、零用户操作。
      - name: 每小时自接力（内置令牌 + 55 分钟节流）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, json, datetime, urllib.request, urllib.error
          repo = os.environ.get("GITHUB_REPOSITORY", "whyx466/sound-vector")
          token = os.environ.get("GH_TOKEN", "")
          state = "collector/out/state/global_heartbeat.json"
          now = time.time()
          min_gap = 55 * 60
          last = 0
          try:
              last = float(json.load(open(state)).get("ts", 0))
          except Exception:
              pass
          if now - last < min_gap:
              print("距上次接力不足 55 分钟（%d 分钟），本轮不再接力" % int((now-last)/60))
              raise SystemExit(0)
          # 记录本次接力时间（components 会在同轮提交）
          os.makedirs(os.path.dirname(state), exist_ok=True)
          json.dump({"ts": now, "at": datetime.datetime.utcnow().isoformat()+"Z"},
                    open(state, "w"))
          url = "https://api.github.com/repos/%s/actions/workflows/collect.yml/dispatches" % repo
          body = json.dumps({"ref": "main"}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "soundvector-heartbeat",
              "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("自接力已发出 HTTP", r.status)
          except urllib.error.HTTPError as e:
              print("自接力失败 HTTP", e.code, e.read().decode()[:150])
          except Exception as e:
              print("自接力异常", str(e)[:150])
          PY
          # 把心跳时间戳提交回仓库，供下一轮读取节流（用内置 token 放行）
          git config user.name "soundvector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add collector/out/state/global_heartbeat.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 海外采集心跳 $(date -u +%H%MZ)" || true
          git push || true
